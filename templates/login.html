<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Acesso Ecorp Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-glow: #FFD700;
      --gold-dark: #8a7122;
      --obsidian: #050505;
      --glass-surface: rgba(12, 12, 12, 0.80);
      --glass-border: rgba(212, 175, 55, 0.3);
      --text-main: #F0F0F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--obsidian);
      background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 90%);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* --- GIROSCÓPIO 3D (FUNDO) --- */
    .scene-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      z-index: 0;
      pointer-events: none;
    }

    .gyro-system {
      position: relative;
      transform-style: preserve-3d;
      width: 500px; 
      height: 500px;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform-style: preserve-3d;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .ring-1 {
      width: 100%;
      height: 100%;
      margin-left: -50%;
      margin-top: -50%;
      border: 1px solid rgba(212, 175, 55, 0.4);
      animation: spinVertical 12s linear infinite;
    }

    .ring-2 {
      width: 80%;
      height: 80%;
      margin-left: -40%;
      margin-top: -40%;
      border: 2px solid var(--gold-dark);
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
      animation: spinHorizontal 15s linear infinite;
    }

    .ring-3 {
      width: 60%;
      height: 60%;
      margin-left: -30%;
      margin-top: -30%;
      border: 1px dashed var(--gold-glow);
      animation: spinChaos 20s linear infinite;
    }

    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, var(--gold-primary) 0%, transparent 70%);
      box-shadow: 0 0 30px var(--gold-primary);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    /* --- CARD DE LOGIN --- */
    .card-wrapper {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 380px;
      background: var(--glass-surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fadeInUp 1s ease-out forwards 0.5s;
    }

    .card-line {
      width: 50px;
      height: 3px;
      background: var(--gold-primary);
      margin: 0 auto 20px;
      box-shadow: 0 0 10px var(--gold-primary);
    }

    .brand-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .brand-sub {
      color: #888;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .custom-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid #333;
      padding: 12px 12px 12px 40px;
      color: white;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    .custom-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-dark);
      font-size: 1rem;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary));
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .footer-links {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .footer-links a {
      color: #666;
      text-decoration: none;
    }

    @keyframes spinVertical {
      0% { transform: rotateY(0deg) rotateX(15deg); }
      100% { transform: rotateY(360deg) rotateX(15deg); }
    }

    @keyframes spinHorizontal {
      0% { transform: rotateX(0deg) rotateZ(15deg); }
      100% { transform: rotateX(360deg) rotateZ(15deg); }
    }

    @keyframes spinChaos {
      0% { transform: rotate3d(1, 1, 1, 0deg); }
      100% { transform: rotate3d(1, 1, 1, 360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .card-wrapper {
        width: 85%;
        padding: 1.8rem 1.5rem;
        margin-top: -20px;
      }

      .brand-title {
        font-size: 1.5rem;
      }
      
      .custom-input {
        font-size: 16px;
        padding: 10px 10px 10px 35px;
      }

      .btn-login {
        padding: 12px;
      }

      .gyro-system {
        width: 110vw; 
        height: 110vw;
        max-width: none;
        max-height: none;
      }
      
      .ring {
        border-width: 2px;
        opacity: 0.7;
      }
    }

    @media (max-width: 360px) {
      .card-wrapper {
        width: 92%;
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="gyro-system">
      <div class="core"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="card-line"></div>
    
    <div class="brand-section">
      <div class="brand-title">Ecorp Network</div>
      <div class="brand-sub">System Login v3.0</div>
    </div>

    <!-- FORM agora envia pro back-end -->
    <form id="loginForm" method="POST" action="/login">
      <div class="input-group">
        <i class="fa-regular fa-user input-icon"></i>
        <input
          type="text"
          class="custom-input"
          placeholder="ID Usuário"
          required
          name="username"
          autocomplete="username"
        >
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input
          type="password"
          class="custom-input"
          placeholder="Senha"
          required
          name="password"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>

      <div class="footer-links">
        <a href="#">Recuperar</a>
        <a href="#">Ajuda</a>
      </div>
    </form>
  </div>

  <script>
    // Efeito de spinner no botão, mas SEM bloquear o envio pro servidor
    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = document.querySelector('.btn-login');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Acessando...';
      btn.style.opacity = '0.8';
      btn.disabled = true;
      // não tem preventDefault, então o formulário é enviado normalmente
    });

    // Paralaxe sutil (como no seu original)
    document.addEventListener('mousemove', (e) => {
      const scene = document.querySelector('.gyro-system');
      const x = (window.innerWidth - e.pageX * 2) / 100;
      const y = (window.innerHeight - e.pageY * 2) / 100;
      
      if (window.innerWidth > 768) {
        scene.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
      }
    });
  </script>
</body>
</html>
