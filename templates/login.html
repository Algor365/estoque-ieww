<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Sistema de Sugestão</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(15,23,42,0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 22px 20px 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .logo span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      background: #020617;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(129,140,248,0.4);
    }

    .btn {
      margin-top: 8px;
      border-radius: 999px;
      border: none;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg,var(--primary),var(--primary-dark));
      color: white;
      transition: all .2s ease;
    }

    .btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .error {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.5);
      color: var(--danger);
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .hint code {
      background: #020617;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Ecorp <span>Network</span></div>
    <div class="subtitle">Acesse para usar a sugestão de produtos por turma</div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div>
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div>
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button class="btn" type="submit">Entrar</button>
    </form>

 
    </div>
  </div>
</body>
</html>
