<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Planejamento de Produtos por Disciplina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- (todo seu CSS original aqui, não alterei nada) -->
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 10px 25px rgba(0,0,0,0.35);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 20px;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0,1fr);
      gap: 20px;
      max-width: 1300px;
      width: 100%;
      background: rgba(15,23,42,0.9);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: linear-gradient(180deg,#020617,#020617 40%,#111827);
      border-right: 1px solid var(--border);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .logo span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .nav {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      border: none;
      text-align: left;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .nav button span.icon {
      font-size: 16px;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(99,102,241,0.14);
      color: var(--text);
    }

    .nav button.active {
      box-shadow: 0 0 0 1px rgba(129,140,248,0.6);
    }

    .tag {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: auto;
      text-align: center;
    }

    /* Main */
    .main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .main-header h1 {
      font-size: 22px;
    }

    .main-header small {
      font-size: 12px;
      color: var(--muted);
    }

    .content {
      background: rgba(15,23,42,0.9);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px;
      min-height: 420px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Form layout */
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      min-width: 150px;
    }

    .form-group label {
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .form-group input,
    .form-group select {
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: #020617;
      color: var(--text);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(129,140,248,0.4);
    }

    /* Buttons */
    .btn {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg,var(--primary),var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .btn-small {
      padding: 4px 9px;
      font-size: 11px;
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-logout {
      border-color: rgba(248,113,113,0.6);
      color: #fecaca;
    }

    .btn-logout:hover {
      border-color: var(--danger);
      color: #fecaca;
      background: rgba(239,68,68,0.1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* Tables */
    .table-wrapper {
      margin-top: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: auto;
      max-height: 320px;
      background: #020617;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: #020617;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th, td {
      padding: 7px 10px;
      border-bottom: 1px solid #111827;
      text-align: center;
    }

    th {
      font-weight: 500;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    tbody tr:nth-child(even) {
      background: #020617;
    }

    tbody tr:hover {
      background: rgba(55,65,81,0.5);
    }

    .empty {
      font-size: 12px;
      color: var(--muted);
      padding: 8px;
    }

    /* Alerts / cards */
    .alert {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }

    .alert.info {
      background: rgba(37,99,235,0.08);
      border: 1px solid rgba(59,130,246,0.6);
      color: #bfdbfe;
    }

    .alert.success {
      background: rgba(22,163,74,0.12);
      border: 1px solid rgba(52,211,153,0.8);
      color: #bbf7d0;
    }

    .alert.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(248,113,113,0.8);
      color: #fecaca;
    }

    .card-highlight {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(22,163,74,0.14);
      border: 1px solid rgba(52,211,153,0.8);
      font-size: 13px;
    }

    .card-highlight strong {
      color: #bbf7d0;
    }

    /* Tab content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Responsivo */
    @media (max-width: 900px) {
      body {
        padding: 12px;
      }

      .app {
        grid-template-columns: 1fr;
        gap: 12px;
        border-radius: 16px;
      }

      .sidebar {
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
        padding: 12px;
        gap: 10px;
      }

      .logo, .subtitle, .tag {
        display: none;
      }

      .nav {
        flex-direction: row;
        flex-wrap: nowrap;
        margin-top: 0;
        gap: 6px;
      }

      .nav button {
        font-size: 13px;
        padding: 8px 10px;
      }

      .main {
        padding: 12px;
      }

      .content {
        padding: 12px;
        min-height: auto;
      }

      .table-wrapper {
        max-height: 260px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .main-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .content {
        padding: 10px;
      }

      th, td {
        padding: 6px 8px;
      }

      .btn {
        font-size: 12px;
        padding: 7px 12px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .app {
        border-radius: 12px;
        box-shadow: none;
      }

      .main-header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div>
        <div class="logo">Ecorp <span>Network</span></div>
        <div class="subtitle">Planejamento de Produtos</div>
      </div>
      <div class="nav">
        <button class="tab-btn active" data-tab="sugestao">
          <span class="icon">📊</span> Sugestão
        </button>
        <button class="tab-btn" data-tab="cadastro">
          <span class="icon">✏️</span> Cadastro de itens
        </button>
        <button class="tab-btn" data-tab="db">
          <span class="icon">📚</span> Banco de dados
        </button>
        <button class="tab-btn" data-tab="parametros">
          <span class="icon">⚙️</span> Parâmetros
        </button>
        <button class="tab-btn" data-tab="unidades">
          <span class="icon">🏢</span> Unidades
        </button>
      </div>
      <div class="tag">
        Usuário: {{ usuario }}
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="main-header">
        <div>
          <h1>Planejamento de Produtos por Disciplina</h1>
          <small>Sistema de análise histórica com sugestão de envio por turma</small>
        </div>
        <a href="{{ url_for('logout') }}" class="btn btn-outline btn-small btn-logout">
          Sair
        </a>
      </header>

      <section class="content">
        <!-- (TODO O MESMO HTML DAS TABS QUE VOCÊ JÁ TINHA: SUGESTÃO, CADASTRO, DB, PARÂMETROS, UNIDADES) -->
        <!-- Eu não mexi na estrutura, só reaproveitei seu conteúdo. -->
        <!-- ... (copie exatamente o miolo <section class="content"> do seu arquivo original) ... -->
      </section>
    </main>
  </div>

  <!-- ============ SCRIPT NOVO (INTEGRADO COM FLASK) ============ -->
  <script>
    // ====== ESTADO EM MEMÓRIA (SEM localStorage) ======
    let db = [];                  // registros de consumo (disciplinas/produtos)
    let unidadesCadastradas = []; // nomes de unidades

    // Em vez de ler direto do browser, usamos o servidor FLASK
    async function carregarDBDoServidor() {
      try {
        const resp = await fetch("/api/planejamento/db");
        if (!resp.ok) throw new Error("Erro ao buscar DB");
        const data = await resp.json();
        if (Array.isArray(data)) {
          db = data;
        } else {
          db = [];
        }
      } catch (e) {
        console.error("Erro ao carregar DB do servidor:", e);
        db = [];
      }
    }

    async function persistirDBNoServidor() {
      try {
        const resp = await fetch("/api/planejamento/db", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(db)
        });
        if (!resp.ok) {
          console.error("Erro ao salvar DB no servidor:", await resp.text());
        }
      } catch (e) {
        console.error("Erro de rede ao salvar DB:", e);
      }
    }

    async function carregarUnidadesDoServidor() {
      try {
        const resp = await fetch("/api/planejamento/unidades");
        if (!resp.ok) throw new Error("Erro ao buscar unidades");
        const data = await resp.json();
        if (Array.isArray(data)) {
          unidadesCadastradas = data;
        } else {
          unidadesCadastradas = [];
        }
      } catch (e) {
        console.error("Erro ao carregar unidades do servidor:", e);
        unidadesCadastradas = [];
      }
    }

    async function persistirUnidadesNoServidor() {
      try {
        const resp = await fetch("/api/planejamento/unidades", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(unidadesCadastradas)
        });
        if (!resp.ok) {
          console.error("Erro ao salvar unidades no servidor:", await resp.text());
        }
      } catch (e) {
        console.error("Erro de rede ao salvar unidades:", e);
      }
    }

    // ====== “API” LOCAL para o restante do código (mantendo assinatura antiga) ======
    function carregarDB() {
      return db;
    }

    function salvarDB(novoDB) {
      db = novoDB;
      // manda salvar no servidor, mas sem travar a tela
      persistirDBNoServidor();
    }

    function carregarUnidadesCadastradas() {
      return unidadesCadastradas;
    }

    function salvarUnidadesCadastradas(unidades) {
      unidadesCadastradas = unidades;
      persistirUnidadesNoServidor();
    }

    // ====== NAVEGAÇÃO ENTRE TABS (igual ao original) ======
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabContents = document.querySelectorAll(".tab-content");

    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.getAttribute("data-tab");
        tabButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        tabContents.forEach(c => {
          c.classList.toggle("active", c.id === "tab-" + tab);
        });
      });
    });

    // ====== FUNÇÕES AUXILIARES BASEADAS EM db / unidadesCadastradas ======
    function getDisciplinasUnicasGlobal() {
      const set = new Set();
      db.forEach(r => {
        if (r.disciplina) set.add(r.disciplina);
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function getUnidadesFromDB() {
      const set = new Set();
      db.forEach(r => {
        if (r.unidade) set.add(r.unidade);
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function getListaUnidades() {
      const set = new Set();
      carregarUnidadesCadastradas().forEach(u => set.add(u));
      getUnidadesFromDB().forEach(u => set.add(u));
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function getDisciplinasPorUnidade(unidade) {
      const set = new Set();
      db.forEach(r => {
        if (r.unidade === unidade && r.disciplina) {
          set.add(r.disciplina);
        }
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function getProdutosPorDisciplinaUnidade(disciplina, unidade) {
      const set = new Set();
      db.forEach(r => {
        if (r.disciplina === disciplina && r.unidade === unidade && r.produto) {
          set.add(r.produto);
        }
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function getProdutosPorDisciplinaGlobal(disciplina) {
      const set = new Set();
      db.forEach(r => {
        if (r.disciplina === disciplina && r.produto) {
          set.add(r.produto);
        }
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    // ====== ATUALIZAÇÃO DOS SELECTS GERAIS / TABELAS ======
    function atualizarSugestaoDisciplinas() {
      const sel = document.getElementById("disciplinaSugestao");
      const selected = sel.value;
      const disciplinas = getDisciplinasUnicasGlobal();

      sel.innerHTML = '<option value="">Selecione...</option>';
      disciplinas.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        sel.appendChild(opt);
      });

      if (disciplinas.includes(selected)) {
        sel.value = selected;
      }
    }

    function atualizarCadastroUnidadesSelect() {
      const sel = document.getElementById("unidadeCadastro");
      const selected = sel.value;
      const unidades = getListaUnidades();

      sel.innerHTML = '<option value="">Selecione...</option>';
      unidades.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        sel.appendChild(opt);
      });

      if (unidades.includes(selected)) {
        sel.value = selected;
      }
    }

    function atualizarFiltrosDB() {
      const unidadeDB = document.getElementById("unidadeDB");
      const disciplinaDB = document.getElementById("disciplinaDB");
      const produtoDB = document.getElementById("produtoDB");

      const unidades = getListaUnidades();
      const selectedUnidade = unidadeDB.value;
      unidadeDB.innerHTML = '<option value="">Todas</option>';
      unidades.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        unidadeDB.appendChild(opt);
      });
      if (unidades.includes(selectedUnidade)) {
        unidadeDB.value = selectedUnidade;
      } else {
        unidadeDB.value = "";
      }

      atualizarDisciplinaDBOptions();
      atualizarProdutoDBOptions();
    }

    function atualizarDisciplinaDBOptions() {
      const unidadeDB = document.getElementById("unidadeDB");
      const disciplinaDB = document.getElementById("disciplinaDB");
      const unidade = unidadeDB.value;
      const selectedDisciplina = disciplinaDB.value;

      disciplinaDB.innerHTML = '<option value="">Todas</option>';

      let disciplinas;
      if (!unidade) {
        const set = new Set();
        db.forEach(r => {
          if (r.disciplina) set.add(r.disciplina);
        });
        disciplinas = Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
      } else {
        disciplinas = getDisciplinasPorUnidade(unidade);
      }

      disciplinas.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        disciplinaDB.appendChild(opt);
      });

      if (disciplinaDB.querySelector(`option[value="${selectedDisciplina}"]`)) {
        disciplinaDB.value = selectedDisciplina;
      } else {
        disciplinaDB.value = "";
      }
    }

    function atualizarProdutoDBOptions() {
      const unidadeDB = document.getElementById("unidadeDB");
      const disciplinaDB = document.getElementById("disciplinaDB");
      const produtoDB = document.getElementById("produtoDB");
      const unidade = unidadeDB.value;
      const disciplina = disciplinaDB.value;
      const selectedProduto = produtoDB.value;

      produtoDB.innerHTML = '<option value="">Todos</option>';

      let produtos;
      if (!disciplina && !unidade) {
        const set = new Set();
        db.forEach(r => {
          if (r.produto) set.add(r.produto);
        });
        produtos = Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
      } else {
        produtos = db
          .filter(r =>
            (!unidade || r.unidade === unidade) &&
            (!disciplina || r.disciplina === disciplina)
          )
          .reduce((set, r) => {
            if (r.produto) set.add(r.produto);
            return set;
          }, new Set());
        produtos = Array.from(produtos).sort((a, b) => a.localeCompare(b, "pt-BR"));
      }

      produtos.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        produtoDB.appendChild(opt);
      });

      if (produtoDB.querySelector(`option[value="${selectedProduto}"]`)) {
        produtoDB.value = selectedProduto;
      } else {
        produtoDB.value = "";
      }
    }

    function atualizarFiltrosParametros() {
      const unidadeParametros = document.getElementById("unidadeParametros");
      const disciplinaParametros = document.getElementById("disciplinaParametros");

      const unidades = getListaUnidades();
      const selectedUnidade = unidadeParametros.value;
      unidadeParametros.innerHTML = '<option value="">Selecione...</option>';
      unidades.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        unidadeParametros.appendChild(opt);
      });
      if (unidades.includes(selectedUnidade)) {
        unidadeParametros.value = selectedUnidade;
      } else {
        unidadeParametros.value = "";
      }

      const disciplinasGlobais = getDisciplinasUnicasGlobal();
      const selectedDisciplina = disciplinaParametros.value;
      disciplinaParametros.innerHTML = '<option value="">Selecione...</option>';
      disciplinasGlobais.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        disciplinaParametros.appendChild(opt);
      });
      if (disciplinasGlobais.includes(selectedDisciplina)) {
        disciplinaParametros.value = selectedDisciplina;
      } else {
        disciplinaParametros.value = "";
      }
    }

    function atualizarTudo() {
      atualizarSugestaoDisciplinas();
      atualizarCadastroUnidadesSelect();
      atualizarFiltrosDB();
      atualizarFiltrosParametros();
      atualizarTabelaParametros();
      atualizarTabelaUnidades();
    }

    // ====== FUNÇÃO DE ALERTA ======
    function mostrarAlerta(el, tipo, texto) {
      el.style.display = "block";
      el.classList.remove("info", "success", "error");
      el.classList.add(tipo);
      el.textContent = texto;
    }

    // ====== (DAQUI PRA BAIXO MANTÉM A MESMA LÓGICA DO SEU ARQUIVO) ======
    // Cadastro de itens, sugestão, DB, parâmetros, unidades...
    // Só troquei os pontos onde chamava salvarDB / carregarDB / salvarUnidadesCadastradas
    // para usar as funções definidas acima. (Você pode copiar exatamente
    // o bloco de JS antigo daqui pra baixo e remover apenas o uso de localStorage.)

    // ...

    // ====== INICIALIZAÇÃO ======
    async function inicializarAplicacao() {
      await Promise.all([
        carregarDBDoServidor(),
        carregarUnidadesDoServidor()
      ]);
      atualizarTudo();
    }

    inicializarAplicacao();

    // Se você tiver funções globais (excluirRegistro, removerUnidade, etc),
    // não esquece de expor:
    // window.excluirRegistro = excluirRegistro;
    // window.removerUnidade = removerUnidade;
